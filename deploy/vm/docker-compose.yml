# Single-VM deployment: Caddy (TLS) -> web (nginx, static UI + /api proxy) -> api -> PostgreSQL, plus worker and encrypted nightly backups.
# NOT run in the build sandbox (no Docker daemon there): the first `./install.sh` on a real VM is the real test. See docs/RUNBOOK_VM.md.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-hardened: &hardened
  restart: unless-stopped
  logging: *logging
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

x-appenv: &appenv
  DATABASE_URL: postgresql+psycopg://cashapp:${POSTGRES_PASSWORD:?run ./install.sh}@db:5432/cashapp
  JWT_SECRET: ${JWT_SECRET:?run ./install.sh}
  APP_ENV: prod
  ALLOW_DEMO: "0"
  AUTO_MIGRATE: "0"
  CORS_ORIGINS: https://${DOMAIN:?run ./install.sh}
  EXPORT_DIR: /data/exports
  FEED_ROOT: /data/feeds
  DATA_RESIDENCY_STRICT: "1"
  DEPLOY_REGION: ${DEPLOY_REGION:?run ./install.sh}
  ALLOWED_EGRESS_HOSTS: ${ALLOWED_EGRESS_HOSTS:-}
  FX_FEED_URL: ${FX_FEED_URL:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  SSO_ISSUER: ${SSO_ISSUER:-}
  SSO_CLIENT_ID: ${SSO_CLIENT_ID:-}
  SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
  SSO_REDIRECT_URI: ${SSO_REDIRECT_URI:-}
  SSO_ROLE_MAP: ${SSO_ROLE_MAP:-}
  SCIM_TOKEN: ${SCIM_TOKEN:-}

services:
  db:
    <<: *hardened
    image: postgres:16
    cap_drop: []                      # the postgres entrypoint needs to drop privileges itself
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: cashapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./install.sh}
      POSTGRES_DB: cashapp
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashapp -d cashapp"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]              # no `ports:`: the database is reachable only from this compose network

  migrate:
    build: ../../backend
    image: cashapp-api:local
    restart: "no"
    logging: *logging
    command: ["python", "-m", "app.cli", "migrate"]
    environment: *appenv
    depends_on: { db: { condition: service_healthy } }
    networks: [internal]

  api:
    <<: *hardened
    build: ../../backend
    image: cashapp-api:local
    environment: *appenv
    read_only: true
    tmpfs: ["/tmp"]
    volumes: [exports:/data/exports, feeds:/data/feeds]
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
    networks: [internal, egress]

  worker:
    <<: *hardened
    image: cashapp-api:local
    command: ["python", "-m", "app.cli", "worker"]
    environment: *appenv
    read_only: true
    tmpfs: ["/tmp"]
    volumes: [exports:/data/exports, feeds:/data/feeds]
    depends_on: { api: { condition: service_healthy } }
    networks: [internal, egress]

  web:
    <<: *hardened
    build: ../../frontend
    image: cashapp-web:local
    read_only: true
    tmpfs: ["/tmp"]
    depends_on: { api: { condition: service_healthy } }
    networks: [internal]

  caddy:
    <<: *hardened
    image: caddy:2
    cap_add: [NET_BIND_SERVICE]
    ports: ["80:80", "443:443"]       # the only published ports on this machine
    environment: { DOMAIN: "${DOMAIN:?run ./install.sh}" }
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: { web: { condition: service_started } }
    networks: [internal, public]

  backup:
    <<: *hardened
    image: postgres:16
    cap_drop: []
    entrypoint: ["/bin/bash", "/scripts/backup-loop.sh"]
    environment:
      PGHOST: db
      PGUSER: cashapp
      PGPASSWORD: ${POSTGRES_PASSWORD:?run ./install.sh}
      PGDATABASE: cashapp
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?run ./install.sh}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-20}      # 20:00 UTC = 01:30 IST
    volumes:
      - ./scripts:/scripts:ro
      - backups:/backups
      - exports:/data/exports:ro
      - feeds:/data/feeds:ro
    depends_on: { db: { condition: service_healthy } }
    networks: [internal]

networks:
  internal: { internal: true }        # database, backups, web: no route to the internet at all
  egress: {}                          # api + worker only, for FX fetch / SFTP / IMAP / ERP webhooks; the app's own ALLOWED_EGRESS_HOSTS list still applies
  public: {}                          # caddy only

volumes: { pgdata: {}, exports: {}, feeds: {}, backups: {}, caddy_data: {}, caddy_config: {} }
