# Non-secret configuration only. Secrets (DATABASE_URL, JWT_SECRET, mailbox/bank/ERP credentials) live in a Secret named
# `cashapp-secrets`, created from your cloud's secrets manager (External Secrets / CSI driver) — never committed.
apiVersion: v1
kind: ConfigMap
metadata: { name: cashapp-config }
data:
  APP_ENV: "prod"
  ALLOW_DEMO: "0"
  DATA_RESIDENCY_STRICT: "1"
  DEPLOY_REGION: "ap-south-1"          # set to YOUR Indian region label (see deploy/README.md for accepted values)
  ALLOWED_EGRESS_HOSTS: "erp.corp.example.in,imap.corp.example.in,www.fbil.org.in"
  FX_FEED_URL: ""                      # set to the live FBIL publication after verifying it (docs/DEPLOYMENT_INDIA.md)
  FX_FEED_CURRENCIES: "USD,EUR,JPY,GBP,CNY,AUD,CAD,CHF,HKD,SGD"   # top-10 most traded; FBIL publishes USD/EUR/GBP/JPY only
  FX_CROSS_FEED_URL: ""                # optional: ECB daily euro reference rates (add the host to ALLOWED_EGRESS_HOSTS) to DERIVE the other six
  EXPORT_DIR: "/data/exports"
  FEED_ROOT: "/data/feeds"
  CORS_ORIGINS: "https://cash.corp.example.in"
