server {
  listen 8080;
  client_max_body_size 30m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;
  location /api/ { proxy_pass http://api:8000; proxy_set_header X-Forwarded-For $remote_addr; proxy_read_timeout 120s; }
  location /health { proxy_pass http://api:8000; }
  location / { root /usr/share/nginx/html; try_files $uri /index.html; }
}
