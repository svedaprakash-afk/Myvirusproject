# Postgres path is provided but NOT yet exercised by the test-suite (tests run on SQLite). Validate before relying on it.
services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: change-me, POSTGRES_DB: cashapp }
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: ./backend
    environment: &apienv
      DATABASE_URL: postgresql+psycopg://postgres:change-me@db/cashapp
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to a long random value}
      APP_ENV: prod
      ALLOW_DEMO: "0"
      EXPORT_DIR: /data/exports
      FEED_ROOT: /data/feeds
      # Data residency: the API refuses to start unless DEPLOY_REGION is an Indian region, and blocks every outbound host
      # that is not listed here (bank APIs, ERP webhook, IMAP, LLM). Add only in-region endpoints.
      DATA_RESIDENCY_STRICT: "1"
      DEPLOY_REGION: ${DEPLOY_REGION:?set DEPLOY_REGION, e.g. ap-south-1}
      ALLOWED_EGRESS_HOSTS: ${ALLOWED_EGRESS_HOSTS:-}
      FX_FEED_URL: ${FX_FEED_URL:-}
    volumes: [exports:/data/exports, feeds:/data/feeds]
    depends_on: [db]
  worker:
    build: ./backend
    command: ["python", "-m", "app.cli", "worker"]
    environment: *apienv
    volumes: [exports:/data/exports, feeds:/data/feeds]
    depends_on: [api]
  web:
    build: ./frontend
    ports: ["8080:8080"]
    depends_on: [api]
volumes: { pgdata: {}, exports: {}, feeds: {} }
