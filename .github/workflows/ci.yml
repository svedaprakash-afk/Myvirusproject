name: ci
on: [push, pull_request]
jobs:
  backend-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - run: pip install -r backend/requirements-dev.txt
      - run: cd backend && pytest
  backend-postgres:        # the same suite on PostgreSQL + the Postgres-only migration tests (enum types, advisory-lock concurrency)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/cashapp_test
      TEST_PG_URL: postgresql+psycopg://postgres:postgres@localhost:5432/mig_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - run: pip install -r backend/requirements-dev.txt
      - run: PGPASSWORD=postgres psql -h localhost -U postgres -c "create database cashapp_test" -c "create database mig_test"
      - run: cd backend && pytest
  migrations-in-sync:      # fails when someone changes a model without generating a migration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r backend/requirements-dev.txt
      - run: cd backend && DATABASE_URL=sqlite:///./ci.db python -m app.cli migrate && DATABASE_URL=sqlite:///./ci.db python -m app.cli status
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci && npm run typecheck && npm test && npm run build
